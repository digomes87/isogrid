[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Both of these come from `macroquad`, which is optional and off by default:
  # only the `macroquad-backend` feature pulls them in. The engine's own code is
  # `forbid(unsafe_code)`, and the renderer sits behind a trait precisely so the
  # backend can be replaced. Reviewed and accepted in
  # docs/adr/0004-macroquad-first.md; revisit if a fixed release appears or if
  # the wgpu backend lands.
  #
  # Soundness issues in macroquad: unprincipled mutable statics, no fix
  # available upstream.
  "RUSTSEC-2025-0035",
  # `ttf-parser`, reached through macroquad's `fontdue`, is unmaintained.
  "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
